[workspace]
resolver = "2"
members = [
    "crates/shared-types",
    "crates/protocol-pump",
    "crates/protocol-pumpswap",
    "crates/protocol-okx-router",
    "crates/transaction-validation",
    "server",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"
rust-version = "1.85"

[workspace.dependencies]
# Solana ecosystem — pin to a compatible set
solana-sdk = "2.2"
solana-client = "2.2"
solana-transaction-status = "2.2"
spl-token = "7"
spl-associated-token-account = "6"

# Serialization
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
bincode = "1.3"
base64 = "0.22"

# Crypto
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"

# Async
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }

# Server
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
jsonwebtoken = "9"

# Error handling / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Shared internal crates
shared-types = { path = "crates/shared-types" }
protocol-pump = { path = "crates/protocol-pump" }
protocol-pumpswap = { path = "crates/protocol-pumpswap" }
protocol-okx-router = { path = "crates/protocol-okx-router" }
transaction-validation = { path = "crates/transaction-validation" }
