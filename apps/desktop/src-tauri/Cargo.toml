[package]
name = "desktop"
version = "0.1.0"
description = "Axiom Solana Memecoin Trading Terminal"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { workspace = true }
solana-sdk = { workspace = true }
spl-token = { workspace = true }
shared-types = { path = "../../../crates/shared-types" }
transaction-validation = { path = "../../../crates/transaction-validation" }
protocol-pump = { path = "../../../crates/protocol-pump" }
protocol-pumpswap = { path = "../../../crates/protocol-pumpswap" }
protocol-okx-router = { path = "../../../crates/protocol-okx-router" }
spl-associated-token-account = { workspace = true }
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
bs58 = "0.5"
thiserror = "2"
tracing = "0.1"
rand = "0.8"
dirs = "5"
base64 = "0.22"
bincode = "1.3"
