<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0b10"/>
    </radialGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="50%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#DC1FFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#neonGlow)" stroke-width="6" stroke-opacity="0.4"/>
  
  <!-- Trading Terminal Glyph -->
  <g filter="url(#glow)">
    <!-- Upward dynamic momentum bars -->
    <path d="M 120 360 L 170 360 L 170 280 L 120 280 Z" fill="#00FFA3" fill-opacity="0.85"/>
    <path d="M 195 360 L 245 360 L 245 210 L 195 210 Z" fill="#00D2FF" fill-opacity="0.9"/>
    <path d="M 270 360 L 320 360 L 320 150 L 270 150 Z" fill="#00FFA3" fill-opacity="0.95"/>
    <path d="M 345 360 L 395 360 L 395 110 L 345 110 Z" fill="#00FFA3"/>
    
    <!-- Lightning trend path -->
    <path d="M 100 320 L 180 260 L 260 270 L 340 160 L 420 100" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Terminal target dot -->
    <circle cx="420" cy="100" r="14" fill="#00FFA3"/>
    <circle cx="420" cy="100" r="24" fill="none" stroke="#00FFA3" stroke-width="4" stroke-opacity="0.6"/>
  </g>
</svg>
